<svg width="100%" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .terminal {
      font-family: 'Courier New', monospace;
      font-size: 42px;
      fill: #3fb950;
    }

    /* Cursor blink */
    .cursor {
      animation: blink 1s steps(2) infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* Text reveal */
    .mask-rect {
      animation: typeDelete 8s steps(33) infinite;
    }

    /* Cursor movement (tighter) */
    .cursor-move {
      animation: cursorMove 8s steps(33) infinite;
    }

    @keyframes typeDelete {
      0%   { width: 0; }
      40%  { width: 900px; }   /* safe reveal */
      60%  { width: 900px; }
      100% { width: 0; }
    }

    @keyframes cursorMove {
      0%   { transform: translateX(0); }
      40%  { transform: translateX(820px); } /* VERY close to text */
      60%  { transform: translateX(820px); }
      100% { transform: translateX(0); }
    }
  </style>

  <!-- Terminal background -->
  <rect x="0" y="0" width="100%" height="100%" rx="14" fill="#0d1117"/>

  <!-- Mask -->
  <mask id="typing-mask">
    <rect x="0" y="0" height="100%" width="0" fill="white" class="mask-rect"/>
  </mask>

  <!-- Prompt -->
  <text x="40" y="90" class="terminal">$ </text>

  <!-- Typed text -->
  <text x="80" y="90" class="terminal" mask="url(#typing-mask)">
    WELCOME TO MOHD SAMEER'S GITHUB
  </text>

  <!-- Moving cursor -->
  <text x="80" y="90" class="terminal cursor cursor-move">█</text>
</svg>
