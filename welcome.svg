<svg width="100%" height="140" viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg">
  <style>
    .terminal {
      font-family: 'Courier New', monospace;
      font-size: 42px;
      fill: #3fb950;
    }

    .cursor {
      animation: blink 1s steps(2) infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .typing {
      animation: typing 4s steps(30, end) forwards;
      white-space: nowrap;
      overflow: hidden;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
  </style>

  <!-- Terminal background -->
  <rect x="0" y="0" width="100%" height="100%" rx="12" fill="#0d1117"/>

  <!-- Prompt -->
  <text x="40" y="80" class="terminal">
    <tspan fill="#3fb950">$</tspan>
    <tspan dx="10" class="typing">WELCOME TO MOHD SAMEER'S GITHUB</tspan>
    <tspan class="cursor">█</tspan>
  </text>
</svg>
