<svg width="100%" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text {
      font-family: 'Segoe UI', 'Helvetica', 'Arial', sans-serif;
      font-size: 48px;
      font-weight: 600;
      fill: none;
      stroke: #58a6ff;
      stroke-width: 2;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: draw 3s ease forwards, glow 1.5s ease-in-out infinite alternate;
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes glow {
      from {
        filter: drop-shadow(0 0 2px #58a6ff);
      }
      to {
        filter: drop-shadow(0 0 8px #58a6ff);
      }
    }
  </style>

  <text
    x="50%"
    y="60%"
    text-anchor="middle"
    dominant-baseline="middle"
    class="text"
  >
    WELCOME TO MOHD SAMEER'S GITHUB
  </text>
</svg>
